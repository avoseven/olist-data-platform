# raw 層のテーブルを dbt の source として登録する。
#
# raw 層は dbt の外 (src/load_raw.py) で CSV から読み込む。全列が STRING。
# テーブル名は CSV のファイル名そのままのため、identifier で短い名前に付け替える。
# 対象のテーブルは docs/decisions/001_table_selection.md を参照。

version: 2

sources:
  - name: olist
    description: Olist の生データ。CSV を全列 STRING のまま読み込んだもの。
    schema: olist_raw
    tables:
      - name: customers
        identifier: olist_customers_dataset
        description: 注文ごとの顧客情報。customer_id は注文ごとに発行される。
      - name: orders
        identifier: olist_orders_dataset
        description: 1 行 = 1 注文。
      - name: order_items
        identifier: olist_order_items_dataset
        description: 1 行 = 注文の明細 1 行。
      - name: products
        identifier: olist_products_dataset
        description: 1 行 = 1 商品。
      - name: order_payments
        identifier: olist_order_payments_dataset
        description: 1 行 = 注文に対する支払い 1 回。
      - name: order_reviews
        identifier: olist_order_reviews_dataset
        description: 1 行 = アンケート回答 (review_id) × 対象の注文 (order_id)。1 注文 1 レビューではない。
      - name: product_category_name_translation
        identifier: product_category_name_translation
        description: 商品カテゴリ名 (ポルトガル語) と英語名の対応。
