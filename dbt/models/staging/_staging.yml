# staging モデルの説明とテスト

version: 2

models:
  - name: stg_orders
    description: 1 行 = 1 注文。
    columns:
      - name: order_id
        description: 注文 ID。主キー。
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: 顧客 ID。注文ごとに発行されるため、注文と 1:1 になる。人を識別するには customer_unique_id を使う。
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: order_status
        description: 注文のステータス。
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [delivered, shipped, canceled, unavailable, invoiced, processing, created, approved]
      - name: order_purchased_at
        description: 購入日時 (タイムゾーンなし)。
        data_tests:
          - not_null
      # 以下の 3 列は、注文の状況によっては欠損するため、無条件には非欠損を要求しない。
      # ただし配達済みの注文ではすべて揃っているはずなので、その条件でテストする。
      # 元データには例外があり (docs/data_notes.md)、staging では行を除かないため、
      # エラーではなく警告にする。例外の扱いは mart で決める。
      - name: order_approved_at
        description: 支払いの承認日時 (タイムゾーンなし)。未承認の注文では NULL。
        data_tests:
          - not_null:
              config:
                where: "order_status = 'delivered'"
                severity: warn
      - name: order_delivered_carrier_at
        description: 配送業者に引き渡した日時 (タイムゾーンなし)。未発送の注文では NULL。
        data_tests:
          - not_null:
              config:
                where: "order_status = 'delivered'"
                severity: warn
      - name: order_delivered_customer_at
        description: 顧客に配達された日時 (タイムゾーンなし)。未配達の注文では NULL。
        data_tests:
          - not_null:
              config:
                where: "order_status = 'delivered'"
                severity: warn
      - name: order_estimated_delivery_date
        description: 購入時に顧客に伝えた配送予定日。
        data_tests:
          - not_null

  - name: stg_customers
    description: 1 行 = 注文ごとの顧客情報。customer_id は注文ごとに発行されるため、同じ人が複数行に現れる。
    columns:
      - name: customer_id
        description: 顧客 ID。主キー。注文ごとに発行される。
        data_tests:
          - unique
          - not_null
          # customer_id は注文ごとに発行されるため、注文のない顧客はいないはず
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: customer_id
      - name: customer_unique_id
        description: 人を識別する ID。同じ人が複数回注文すると、複数の customer_id に同じ値が入る。
        data_tests:
          - not_null
      - name: customer_zip_code_prefix
        description: 郵便番号の先頭 5 桁。先頭の 0 を保つため STRING。
        data_tests:
          - not_null
      - name: customer_city
        description: 市の名前 (小文字、アクセント記号なし)。
        data_tests:
          - not_null
      - name: customer_state
        description: 州のコード (ブラジルの 26 州と連邦直轄区)。
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [AC, AL, AM, AP, BA, CE, DF, ES, GO, MA, MG, MS, MT, PA, PB, PE, PI, PR, RJ, RN, RO, RR, RS, SC, SE, SP, TO]
