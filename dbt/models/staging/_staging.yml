# staging モデルの説明とテスト

version: 2

models:
  - name: stg_orders
    description: 1 行 = 1 注文。
    columns:
      - name: order_id
        description: 注文 ID。主キー。
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: 顧客 ID。注文ごとに発行されるため、注文と 1:1 になる。人を識別するには customer_unique_id を使う。
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: order_status
        description: 注文のステータス。
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [delivered, shipped, canceled, unavailable, invoiced, processing, created, approved]
      - name: order_purchased_at
        description: 購入日時 (タイムゾーンなし)。
        data_tests:
          - not_null
      # 以下の 3 列は、注文の状況によっては欠損するため、無条件には非欠損を要求しない。
      # ただし配達済みの注文ではすべて揃っているはずなので、その条件でテストする。
      # 元データには例外があり (docs/data_notes.md)、staging では行を除かないため、
      # エラーではなく警告にする。例外の扱いは mart で決める。
      - name: order_approved_at
        description: 支払いの承認日時 (タイムゾーンなし)。未承認の注文では NULL。
        data_tests:
          - not_null:
              config:
                where: "order_status = 'delivered'"
                severity: warn
      - name: order_delivered_carrier_at
        description: 配送業者に引き渡した日時 (タイムゾーンなし)。未発送の注文では NULL。
        data_tests:
          - not_null:
              config:
                where: "order_status = 'delivered'"
                severity: warn
      - name: order_delivered_customer_at
        description: 顧客に配達された日時 (タイムゾーンなし)。未配達の注文では NULL。
        data_tests:
          - not_null:
              config:
                where: "order_status = 'delivered'"
                severity: warn
      - name: order_estimated_delivery_date
        description: 購入時に顧客に伝えた配送予定日。
        data_tests:
          - not_null

  - name: stg_customers
    description: 1 行 = 注文ごとの顧客情報。customer_id は注文ごとに発行されるため、同じ人が複数行に現れる。
    columns:
      - name: customer_id
        description: 顧客 ID。主キー。注文ごとに発行される。
        data_tests:
          - unique
          - not_null
          # customer_id は注文ごとに発行されるため、注文のない顧客はいないはず
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: customer_id
      - name: customer_unique_id
        description: 人を識別する ID。同じ人が複数回注文すると、複数の customer_id に同じ値が入る。
        data_tests:
          - not_null
      - name: customer_zip_code_prefix
        description: 郵便番号の先頭 5 桁。先頭の 0 を保つため STRING。
        data_tests:
          - not_null
      - name: customer_city
        description: 市の名前 (小文字、アクセント記号なし)。
        data_tests:
          - not_null
      - name: customer_state
        description: 州のコード (ブラジルの 26 州と連邦直轄区)。
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [AC, AL, AM, AP, BA, CE, DF, ES, GO, MA, MG, MS, MT, PA, PB, PE, PI, PR, RJ, RN, RO, RR, RS, SC, SE, SP, TO]

  - name: stg_order_items
    description: 1 行 = 注文の明細 1 行。数量の列はなく、同じ商品を複数個買うと明細が複数行になる。
    data_tests:
      # 主キーは (order_id, order_item_id) の複合キー
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [order_id, order_item_id]
    columns:
      - name: order_id
        description: 注文 ID。
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: order_item_id
        description: 注文の中での明細番号 (1 から始まる連番)。
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: product_id
        description: 商品 ID。
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
      - name: seller_id
        description: 販売者 ID。sellers テーブルは取り込んでいないため、結合先はない (ADR 001)。
        data_tests:
          - not_null
      - name: shipping_limit_at
        description: 販売者が配送業者に引き渡す期限 (タイムゾーンなし)。購入から約 3 年後になっている不整合な値が 4 行ある。
        data_tests:
          - not_null
      - name: price
        description: 商品の価格 (ブラジルレアル)。
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false
      - name: freight_value
        description: 明細ごとの送料 (ブラジルレアル)。送料無料の明細は 0。
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

  - name: stg_products
    description: 1 行 = 1 商品。
    columns:
      - name: product_id
        description: 商品 ID。主キー。
        data_tests:
          - unique
          - not_null
      # カテゴリ・重さ・サイズは、商品であれば本来あるはずなのでテストする。
      # 元データには例外があり (docs/data_notes.md)、staging では行を除かないため警告にする。
      - name: product_category_name
        description: 商品カテゴリ名 (ポルトガル語)。610 件は欠損している。
        data_tests:
          - not_null:
              config:
                severity: warn
          # 英訳のないカテゴリが 2 種類 (13 件) ある
          - relationships:
              arguments:
                to: ref('stg_product_category_name_translation')
                field: product_category_name
              config:
                severity: warn
      - name: product_name_length
        description: 商品名の文字数。元データの列名 product_name_lenght のスペルミスを直したもの。
      - name: product_description_length
        description: 商品説明の文字数。元データの列名 product_description_lenght のスペルミスを直したもの。
      - name: product_photos_qty
        description: 商品写真の枚数。
      - name: product_weight_g
        description: 重さ (g)。0 の商品が 4 件ある。
        data_tests:
          - not_null:
              config:
                severity: warn
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false
              config:
                severity: warn
      - name: product_length_cm
        description: 長さ (cm)。
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: product_height_cm
        description: 高さ (cm)。
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: product_width_cm
        description: 幅 (cm)。
        data_tests:
          - not_null:
              config:
                severity: warn

  - name: stg_product_category_name_translation
    description: 1 行 = 1 カテゴリ。ポルトガル語名と英語名の対応。
    columns:
      - name: product_category_name
        description: 商品カテゴリ名 (ポルトガル語)。主キー。
        data_tests:
          - unique
          - not_null
      - name: product_category_name_english
        description: 商品カテゴリ名 (英語)。
        data_tests:
          - unique
          - not_null

  - name: stg_order_payments
    description: 1 行 = 注文に対する支払い 1 回。1 つの注文を複数の方法・回数に分けて支払うことがある。
    data_tests:
      # 主キーは (order_id, payment_sequential) の複合キー
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [order_id, payment_sequential]
    columns:
      - name: order_id
        description: 注文 ID。
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: payment_sequential
        description: 注文の中での支払いの連番。80 件の注文では 2 から始まる (1 番目の支払いが欠けているわけではなく、金額は明細と一致する)。
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: payment_type
        description: 支払い方法。not_defined の 3 件はキャンセルされた注文で、金額は 0。
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [credit_card, boleto, voucher, debit_card, not_defined]
      - name: payment_installments
        description: 分割払いの回数。一括払いは 1。
        data_tests:
          - not_null
          # クレジットカードで 0 回になっている不整合な値が 2 件ある
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
              config:
                severity: warn
      - name: payment_value
        description: 支払い金額 (ブラジルレアル)。voucher と not_defined では 0 のことがある。
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

  - name: stg_order_reviews
    description: >-
      1 行 = アンケート回答 (review_id) × 対象の注文 (order_id)。
      1 注文に複数のレビューが付くことも、1 つのレビューが複数の注文に紐づくこともあるため、
      review_id と order_id はそれぞれ単独では一意にならない。
      使うときは分析の単位に応じて重複を除く・集約する必要がある。
    data_tests:
      # 主キーは (review_id, order_id) の複合キー
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [review_id, order_id]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "review_answered_at >= cast(review_creation_date as datetime)"
    columns:
      - name: review_id
        description: レビュー (アンケート回答) の ID。複数の注文に紐づくことがある。
        data_tests:
          - not_null
      - name: order_id
        description: 注文 ID。1 つの注文に複数のレビューが付くことがある。
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: review_score
        description: 評価 (1〜5)。
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false
      - name: review_comment_title
        description: コメントのタイトル (任意入力)。前後の空白を除き、空白だけのものは NULL にしている。
      - name: review_comment_message
        description: コメントの本文 (任意入力)。前後の空白を除き、空白だけのものは NULL にしている。改行を含むことがある。
      - name: review_creation_date
        description: アンケートを送った日。
        data_tests:
          - not_null
      - name: review_answered_at
        description: アンケートに回答した日時 (タイムゾーンなし)。
        data_tests:
          - not_null
